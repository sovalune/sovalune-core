[workspace]
resolver = "2"
members = [
    "crates/sovalune-api",
    "crates/sovalune-domain",
    "crates/sovalune-storage-client",
    "crates/sovalune-bus",
    "crates/sovalune-config",
    "bin/sovalune-server",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
async-nats = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

# Sovalune crates
sovalune-domain = { path = "crates/sovalune-domain" }
sovalune-storage-client = { path = "crates/sovalune-storage-client" }
sovalune-bus = { path = "crates/sovalune-bus" }
sovalune-config = { path = "crates/sovalune-config" }
sovalune-api = { path = "crates/sovalune-api" }
